  <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff341e" stop-opacity="0"/><stop offset=".45" stop-color="#ff5c22"/><stop offset=".75" stop-color="#ffc46a"/><stop offset="1" stop-color="#ff2419" stop-opacity="0"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
